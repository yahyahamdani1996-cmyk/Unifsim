# PCG*_S paper, Sec. 7.2: static vs dynamic TL-planes on sporadic tasks.
# Same task sets (and the same releases) for every alpha and both splittings.
# Difference with the paper: speeds are drawn in 1-10 with the slowest set to 1
# (random_platform); the paper draws all m speeds freely in [1, 10].
name        = "sec7_2_static_vs_dynamic"
description = "PCG*_S static (pcg_star_v2) vs dynamic (pcg_star_v2_dyn) TL-planes, n=20, m=8, y=0.70"
schedulers  = ["pcg_star_v2", "pcg_star_v2_dyn"]
count       = 500
seed        = 2026

[grid]
n      = 20
m      = 8
speeds = "1-10"
load   = 0.70

[generator]
kind         = "groups"
period_range = "10-100"

[simulation]
arrivals      = "sporadic"
alpha         = [0, 0.25, 0.5, 0.75, 1, 2, 3]
first_release = "random"
horizon       = "10*Tmax"
